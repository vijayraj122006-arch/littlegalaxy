<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff5fb7" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#1e1035" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#070817" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="300" cy="180" r="45" fill="none" stroke="#ff5fb7" stroke-width="2" opacity="0.6"/>
  <circle cx="300" cy="180" r="8" fill="#ffd48a" filter="url(#glow)"/>
  <path d="M 270 210 Q 300 130 330 210" fill="none" stroke="#4fd6d0" stroke-width="1.5" opacity="0.8"/>
  <text x="300" y="270" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" fill="#fff4e0" letter-spacing="2">The First Hello</text>
  <text x="300" y="295" text-anchor="middle" font-family="'Caveat', cursive" font-size="16" fill="#ffd48a">Where our universe began</text>
</svg>
